<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KuchuPuchu</title>
    <meta
      name="description"
      content="KuchuPuchu — messages, photos and more, right in your browser."
    />
    <meta name="theme-color" content="#0D1524" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <style>
      /* The app's own dark-blue palette (Theme.kt), kept identical on purpose. */
      :root {
        --bg: #0d1524;
        --card: #16213a;
        --ink: #e9edf6;
        --muted: #8a97b2;
        --line: #233150;
        --blue: #2f6fed;
        --blue-deep: #60a5fa;
        --gold: #f59e0b;
        --green: #16a34a;
        --red: #dc2626;
        --seen: #53bdeb;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Segoe UI",
          Roboto,
          "Noto Sans Bengali",
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 15px;
        overscroll-behavior: none;
      }
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .screen {
        display: none;
        flex: 1;
        min-height: 0;
        flex-direction: column;
      }
      .screen.on {
        display: flex;
      }
      button {
        font: inherit;
        border: none;
        cursor: pointer;
        border-radius: 10px;
      }

      /* ---------- login ---------- */
      #login {
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .login-card {
        width: min(400px, 100%);
        background: var(--card);
        border-radius: 20px;
        padding: 28px 24px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }
      .logo {
        width: 74px;
        height: 74px;
        margin: 0 auto 14px;
        display: block;
      }
      .login-card h1 {
        text-align: center;
        margin: 0 0 4px;
        font-size: 24px;
      }
      .login-card .sub {
        text-align: center;
        color: var(--muted);
        margin: 0 0 20px;
        font-size: 13.5px;
        line-height: 1.5;
      }
      .field {
        display: flex;
        gap: 8px;
      }
      .field input {
        flex: 1;
        background: var(--bg);
        border: 1.5px solid var(--line);
        color: var(--ink);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 16px;
        outline: none;
      }
      .field input:focus {
        border-color: var(--blue);
      }
      .btn {
        background: var(--blue);
        color: #fff;
        padding: 12px 18px;
        font-weight: 600;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .btn.gold {
        background: var(--gold);
        color: #fffbeb;
      }
      #loginStatus {
        margin: 14px 0 0;
        text-align: center;
        color: var(--muted);
        font-size: 13.5px;
        line-height: 1.55;
        min-height: 20px;
      }
      #loginStatus.err {
        color: #f87171;
      }

      /* ---------- shared top bar ---------- */
      .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      .topbar .back {
        background: none;
        color: var(--blue-deep);
        font-size: 22px;
        padding: 4px 10px;
        border-radius: 50%;
      }
      .avatar {
        flex: none;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: linear-gradient(135deg, #60a5fa, #2f6fed);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 16px;
        overflow: hidden;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .topbar .titles {
        flex: 1;
        min-width: 0;
      }
      .topbar .t1 {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .topbar .t2 {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ---------- chat list ---------- */
      #list {
        min-height: 0;
      }
      .rows {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 14px;
        cursor: pointer;
      }
      .row:hover {
        background: rgba(47, 111, 237, 0.08);
      }
      .row .mid {
        flex: 1;
        min-width: 0;
        border-bottom: 1px solid var(--line);
        padding: 6px 0;
      }
      .row:last-child .mid {
        border-bottom: none;
      }
      .row .l1 {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .row .name {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .time {
        color: var(--muted);
        font-size: 11.5px;
        flex: none;
      }
      .row .l2 {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 2px;
      }
      .row .prev {
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .badge {
        flex: none;
        background: var(--blue);
        color: #fff;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 7px;
        min-width: 20px;
        text-align: center;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        padding: 60px 20px;
        line-height: 1.7;
      }

      /* ---------- chat ---------- */
      #chat {
        min-height: 0;
      }
      #msgs {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
        padding: 12px 10px 6px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .day {
        align-self: center;
        color: var(--muted);
        font-size: 11.5px;
        background: rgba(0, 0, 0, 0.25);
        border-radius: 8px;
        padding: 3px 10px;
        margin: 8px 0 4px;
      }
      .mrow {
        display: flex;
        flex-direction: column;
        max-width: 78%;
      }
      .mrow.mine {
        align-self: flex-end;
        align-items: flex-end;
      }
      .mrow.their {
        align-self: flex-start;
        align-items: flex-start;
      }
      .bubble {
        background: var(--card);
        border-radius: 14px;
        border-bottom-right-radius: 4px;
        padding: 8px 11px 6px;
        line-height: 1.45;
        word-wrap: break-word;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .mrow.mine .bubble {
        background: linear-gradient(135deg, #2f6fed, #2757c4);
        color: #fff;
        border-bottom-right-radius: 14px;
        border-bottom-left-radius: 4px;
      }
      .bubble img.pic {
        display: block;
        max-width: min(320px, 66vw);
        border-radius: 10px;
        margin: -2px -4px 4px;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 9px;
        background: rgba(0, 0, 0, 0.22);
        border-radius: 10px;
        padding: 8px 10px;
        margin: -2px -3px 4px;
      }
      .chip .ico {
        font-size: 20px;
      }
      .chip .fn {
        font-size: 13px;
        font-weight: 600;
        max-width: 210px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chip .fs {
        font-size: 11px;
        color: var(--muted);
      }
      .stamp {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.75);
        margin-top: 2px;
        padding-left: 2px;
      }
      .mrow.their .stamp {
        color: var(--muted);
      }
      .sender {
        font-size: 12px;
        font-weight: 700;
        color: var(--gold);
        margin: 0 4px 1px;
      }
      .tick {
        letter-spacing: -2.5px;
        font-size: 13px;
        line-height: 1;
      }
      .tick.seen {
        color: var(--seen);
      }
      .typing {
        color: var(--muted);
        font-size: 12.5px;
        padding: 2px 16px 6px;
        min-height: 20px;
      }

      /* ---------- composer ---------- */
      .composer {
        flex: none;
        display: flex;
        gap: 8px;
        align-items: flex-end;
        padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
        background: var(--card);
        border-top: 1px solid var(--line);
      }
      .composer textarea {
        flex: 1;
        resize: none;
        background: var(--bg);
        border: 1.5px solid var(--line);
        color: var(--ink);
        border-radius: 18px;
        padding: 10px 14px;
        font: inherit;
        max-height: 120px;
        outline: none;
        line-height: 1.4;
      }
      .composer textarea:focus {
        border-color: var(--blue);
      }
      .composer .send,
      .composer .plus {
        flex: none;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }
      .composer .plus {
        background: none;
        color: var(--blue-deep);
      }
      .composer .send {
        background: var(--blue);
        color: #fff;
      }
      .off {
        display: none !important;
      }
      #connDot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--red);
        flex: none;
      }
      #connDot.on {
        background: var(--green);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- login -->
      <section id="login" class="screen on">
        <div class="login-card">
          <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#60A5FA" />
                <stop offset="1" stop-color="#2F6FED" />
              </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="46" fill="url(#lg)" />
            <path
              d="M30 38c0-5 4-9 9-9h22c5 0 9 4 9 9v14c0 5-4 9-9 9H47l-11 9v-9h-0.5c-3 0-5.5-2.5-5.5-5.5z"
              fill="#fff"
              opacity="0.95"
            />
            <circle cx="41" cy="45" r="3.4" fill="#2F6FED" />
            <circle cx="50" cy="45" r="3.4" fill="#2F6FED" />
            <circle cx="59" cy="45" r="3.4" fill="#2F6FED" />
          </svg>
          <h1>KuchuPuchu Web</h1>
          <p class="sub">
            আপনার ফোন নম্বর দিন — অনুমোদনের জন্য ফোনের অ্যাপে বার্তা পাঠানো হবে।<br />
            Enter your phone number to sign in.
          </p>
          <div class="field">
            <input
              id="phone"
              type="tel"
              inputmode="tel"
              placeholder="+8801XXXXXXXXX"
              autocomplete="tel"
            />
            <button id="loginBtn" class="btn">Go</button>
          </div>
          <p id="loginStatus"></p>
        </div>
      </section>

      <!-- chat list -->
      <section id="list" class="screen">
        <div class="topbar">
          <div class="avatar" id="meAvatar">K</div>
          <div class="titles">
            <div class="t1">Chats</div>
            <div class="t2" id="meName">KuchuPuchu Web</div>
          </div>
          <span id="connDot" title="live connection"></span>
          <button
            class="btn"
            id="logoutBtn"
            style="background: none; color: var(--muted); font-size: 12.5px"
          >
            Log out
          </button>
        </div>
        <div
          id="unlock"
          class="off"
          style="
            flex: none;
            background: rgba(245, 158, 11, 0.12);
            border-bottom: 1px solid var(--line);
            padding: 10px 14px;
            display: flex;
            gap: 8px;
            align-items: center;
          "
        >
          <span style="font-size: 18px">🔐</span>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 13px">
              আপনার এনক্রিপশন পাসফ্রেজ দিন — তাহলেই সব পুরোনো মেসেজ খুলবে।
            </div>
            <div style="font-size: 11.5px; color: var(--muted)">
              Enter your encryption passphrase to unlock your chats.
            </div>
            <div id="unlockMsg" style="font-size: 11.5px; color: #f87171"></div>
          </div>
          <input
            id="unlockPass"
            type="password"
            placeholder="passphrase"
            style="
              background: var(--bg);
              border: 1.5px solid var(--line);
              color: var(--ink);
              border-radius: 10px;
              padding: 8px 10px;
              font-size: 14px;
              outline: none;
              width: 130px;
            "
          />
          <button class="btn gold" id="unlockBtn" style="padding: 8px 12px; font-size: 13px">
            Unlock
          </button>
        </div>
        <div class="rows" id="rows"></div>
      </section>

      <!-- chat -->
      <section id="chat" class="screen">
        <div class="topbar">
          <button class="back" id="backBtn" title="Back">‹</button>
          <div class="avatar" id="chatAvatar">?</div>
          <div class="titles">
            <div class="t1" id="chatTitle">Chat</div>
            <div class="t2" id="chatSub"></div>
          </div>
          <span
            id="connDot2"
            style="width: 8px; height: 8px; border-radius: 50%; background: var(--red)"
          ></span>
        </div>
        <div id="msgs"></div>
        <div class="typing" id="typing"></div>
        <div class="composer" id="composer">
          <button class="plus" id="photoBtn" title="Send a photo">＋</button>
          <textarea id="input" rows="1" placeholder="Message"></textarea>
          <button class="send" id="sendBtn" title="Send">➤</button>
          <input type="file" id="photoPick" accept="image/*" class="off" />
        </div>
      </section>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
