<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Slice J cutover: same install metadata the legacy ./public PWA had,
         so existing home-screen installs keep their icon and manifest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- Slice I security contract (docs/web-hardening.md): same-origin app,
         one allowlisted third party (Google Identity Services), no inline
         scripts, no object/embed, navigations cannot escape the origin.
         style-src keeps 'unsafe-inline' because GSI injects style attributes;
         scripts never need it. In production the Worker stamps the same
         policy PLUS frame-ancestors as a response header (a meta tag cannot
         carry it); the meta stays as the belt for worker-less previews. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss: https://accounts.google.com; frame-src https://accounts.google.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="theme-color" content="#0d1524" />
    <meta
      name="description"
      content="KuchuPuchu — messages, photos and more, right in your browser."
    />
    <title>KuchuPuchu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
