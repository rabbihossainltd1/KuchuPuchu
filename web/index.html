<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Slice J cutover (docs/web-cutover.md): the CSP — same-origin app, one
         allowlisted third party (Google Identity Services), no inline scripts,
         no object/embed, navigations cannot escape the origin, plus
         frame-ancestors which a <meta> cannot carry — is served as a SERVER
         header by the Worker's assets rules (wrangler.toml [[assets.rules]],
         pinned by contract case 79). One source of truth: no meta CSP here. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d1524" />
    <meta
      name="description"
      content="KuchuPuchu messages, photos and more — right in your browser."
    />
    <title>KuchuPuchu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
