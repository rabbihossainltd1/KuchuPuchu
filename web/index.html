<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Slice I security contract (docs/web-hardening.md): same-origin app,
         one allowlisted third party (Google Identity Services), no inline
         scripts, no object/embed, navigations cannot escape the origin.
         style-src keeps 'unsafe-inline' because GSI injects style attributes;
         scripts never need it. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss: https://accounts.google.com; frame-src https://accounts.google.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="theme-color" content="#0d1524" />
    <meta
      name="description"
      content="KuchuPuchu Web account and navigation preview. Browser sign-in is available only in opt-in builds; messaging, status, media and calls remain disabled."
    />
    <title>KuchuPuchu Web · Account preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
