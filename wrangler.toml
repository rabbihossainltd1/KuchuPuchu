name = "kuchupuchu-api"
main = "src/worker/index.ts"
compatibility_date = "2025-08-01"
account_id = "92081fac7caf54a46a756c382081544b"
workers_dev = true

# One-minute cron: reap stale RINGING calls so a call nobody polls (both phones
# backgrounded) still flips to MISSED and fires the missed-call push — the
# "X is calling card stuck, no missed call" bug.
[triggers]
crons = ["* * * * *"]

# Realtime fan-out (Steps 2-3 fill in the class bodies). One ChatRoom object
# per conversation (plus "user:<id>" list channels); one CallSignal object per
# call for WebRTC signalling. D1 stays the source of truth — the objects only
# hold live WebSocket connections and broadcast what the REST handlers write.
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"
# The namespace ids are pinned on purpose. A binding without an id makes
# wrangler create a NEW namespace on the next deploy, and the live sockets
# (and the call signalling they carry) would land in the new one while the
# app keeps talking to the old one - a silent realtime outage. Same reason
# the D1 database_id below is written down.
id = "e5ffd3c56fb14a83a5b4082b5651f7f8"

[[durable_objects.bindings]]
name = "CALL_SIGNAL"
class_name = "CallSignal"
id = "32ce69ee2dcf41cdb97d540b05bce1b3"

[[durable_objects.bindings]]
name = "CLASSROOM_SIGNAL"
class_name = "ClassroomSignal"
id = "a100d537fdd54ea291b91b6c8c8f02c7"

[[migrations]]
tag = "v1-realtime-do"
new_sqlite_classes = ["ChatRoom", "CallSignal"]

[[migrations]]
tag = "v2-classroom-mesh"
new_sqlite_classes = ["ClassroomSignal"]

[[d1_databases]]
binding = "DB"
database_name = "kuchupuchu-v3-apac"
# 2026-09-04: migrated off kuchupuchu-v3 (dbb7ce3a…, primary WNAM) — every
# query from a BD user paid a trans-Pacific RTT, which was the structural
# slowness behind slow opens/search/polls. Primary is now Singapore (APAC)
# with read replication auto (reads served from the replica nearest each
# user). The old database is kept untouched = one-line rollback.
database_id = "28f6c033-4334-4fc0-ba1c-441ab42cf9a0"

# §52: the hourly cron probes this origin's /api/health to record backend latency
# (worker + D1 round trip). Unset means the probe reports `lat.err` instead of guessing.
[vars]
SELF_ORIGIN = "https://kuchupuchu-api.kuchupuchu.workers.dev"
# Owner round 48: the Workers-AI rescue brain needs the account id at
# runtime (the token stays a secret; this is config, not a secret).
CF_ACCOUNT = "92081fac7caf54a46a756c382081544b"
# Laravel remains authoritative for classroom entitlement and room access.
# This is a public origin; the shared assertion key remains a Worker secret.
LARAVEL_CLASSROOM_ORIGIN = "https://vintoxbd.online"


[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kp-media"

# r104-web / slice J cutover (integration of the two parallel slice-J attempts;
# owner chose the worker-stamped-header mechanism, PR #94): the React PWA
# (web/dist) is THE production web client, served from THIS worker — same
# origin as /api and /ws, no CORS surface, no second deploy. ./public is
# retired (kept in-repo for the legacy contract cases 04/55 and rollback
# history; see public/RETIRED.md).
#
# The build step produces web/dist before every deploy; Workers Builds'
# production trigger runs `npx wrangler deploy`, and wrangler runs [build]
# command first — so the cutover needs no dashboard change.
[build]
command = "npm run build:web:prod"

# 2026-10-19 stale-cutover fix: statics are served BY Cloudflare's asset layer
# (serve-directly), NOT through the worker. Routing every path through the
# worker (run_worker_first = ["/*"]) let Cloudflare's worker-response edge
# cache serve the PREVIOUS build's worker-stamped HTML/PNG/JS for a week —
# redeploys never refreshed it (verified live: env.ASSETS served the NEW build
# from inside while the public got the OLD one; even a 17-asset brownfield
# redeploy and a no-assets teardown left the stale layer in front). Only the
# requests that MUST run worker code stay on the worker: /api/*, /ws/* and
# /download/apk (the signed R2 stream). The security headers moved to the
# assets `_headers` file (the single source of truth now — served by the asset
# layer, so they can no longer go stale); the worker's serveShellAsset is kept
# only as the binding-free preview fallback. See docs/web-cutover.md.
[assets]
directory = "./web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws/*", "/download/apk"]

