name = "kuchupuchu-api"
main = "src/worker/index.ts"
compatibility_date = "2025-08-01"
account_id = "92081fac7caf54a46a756c382081544b"
workers_dev = true

# One-minute cron: reap stale RINGING calls so a call nobody polls (both phones
# backgrounded) still flips to MISSED and fires the missed-call push — the
# "X is calling card stuck, no missed call" bug.
[triggers]
crons = ["* * * * *"]

# Realtime fan-out (Steps 2-3 fill in the class bodies). One ChatRoom object
# per conversation (plus "user:<id>" list channels); one CallSignal object per
# call for WebRTC signalling. D1 stays the source of truth — the objects only
# hold live WebSocket connections and broadcast what the REST handlers write.
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[durable_objects.bindings]]
name = "CALL_SIGNAL"
class_name = "CallSignal"

[[migrations]]
tag = "v1-realtime-do"
new_sqlite_classes = ["ChatRoom", "CallSignal"]

[[d1_databases]]
binding = "DB"
database_name = "kuchupuchu-v3-apac"
# 2026-09-04: migrated off kuchupuchu-v3 (dbb7ce3a…, primary WNAM) — every
# query from a BD user paid a trans-Pacific RTT, which was the structural
# slowness behind slow opens/search/polls. Primary is now Singapore (APAC)
# with read replication auto (reads served from the replica nearest each
# user). The old database is kept untouched = one-line rollback.
database_id = "28f6c033-4334-4fc0-ba1c-441ab42cf9a0"

# §52: the hourly cron probes this origin's /api/health to record backend latency
# (worker + D1 round trip). Unset means the probe reports `lat.err` instead of guessing.
[vars]
SELF_ORIGIN = "https://kuchupuchu-api.kuchupuchu.workers.dev"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kp-media"
