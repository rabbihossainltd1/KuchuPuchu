name = "kuchupuchu-api"
main = "src/worker/index.ts"
compatibility_date = "2025-08-01"
account_id = "92081fac7caf54a46a756c382081544b"
workers_dev = true

# One-minute cron: reap stale RINGING calls so a call nobody polls (both phones
# backgrounded) still flips to MISSED and fires the missed-call push — the
# "X is calling card stuck, no missed call" bug.
[triggers]
crons = ["* * * * *"]

# Realtime fan-out (Steps 2-3 fill in the class bodies). One ChatRoom object
# per conversation (plus "user:<id>" list channels); one CallSignal object per
# call for WebRTC signalling. D1 stays the source of truth — the objects only
# hold live WebSocket connections and broadcast what the REST handlers write.
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[durable_objects.bindings]]
name = "CALL_SIGNAL"
class_name = "CallSignal"

[[migrations]]
tag = "v1-realtime-do"
new_sqlite_classes = ["ChatRoom", "CallSignal"]

[[d1_databases]]
binding = "DB"
database_name = "kuchupuchu-v3-apac"
# 2026-09-04: migrated off kuchupuchu-v3 (dbb7ce3a…, primary WNAM) — every
# query from a BD user paid a trans-Pacific RTT, which was the structural
# slowness behind slow opens/search/polls. Primary is now Singapore (APAC)
# with read replication auto (reads served from the replica nearest each
# user). The old database is kept untouched = one-line rollback.
database_id = "28f6c033-4334-4fc0-ba1c-441ab42cf9a0"

# §52: the hourly cron probes this origin's /api/health to record backend latency
# (worker + D1 round trip). Unset means the probe reports `lat.err` instead of guessing.
[vars]
SELF_ORIGIN = "https://kuchupuchu-api.kuchupuchu.workers.dev"
# Owner round 48: the Workers-AI rescue brain needs the account id at
# runtime (the token stays a secret; this is config, not a secret).
CF_ACCOUNT = "92081fac7caf54a46a756c382081544b"


[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kp-media"

# Slice J (production cutover): the React PWA is now THE served client. The
# built app lives in ./web/dist; `./public` is retired (kept in the repo only
# as the legacy reference pinned by contract cases 04/55 and as rollback
# history — it is no longer served). Same origin as /api and /ws, so there is
# no CORS surface and no second deploy; unknown paths fall back to index.html.
#
# The Workers Builds production trigger runs `npx wrangler deploy` with a blank
# build command, so the web build is hooked HERE: wrangler runs [build]
# command before bundling/uploading, on both `deploy` and `versions upload`.
# No dashboard change is needed and the assets can never be stale.
[build]
command = "npm run build:web:prod"

[assets]
directory = "./web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws/*"]

# Response headers (the CSP including frame-ancestors, no-store sw.js,
# nosniff, referrer policy) live in web/public/_headers — the documented
# Workers Assets mechanism; wrangler has no toml-level rules for it.
