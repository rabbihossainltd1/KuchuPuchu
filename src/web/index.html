<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e3a017" />
    <meta
      name="description"
      content="KuchuPuchu is a premium social app for Free Fire players who want trusted Duo and Squad partners."
    />
    <meta property="og:title" content="KuchuPuchu" />
    <meta
      property="og:description"
      content="Find a trusted Free Fire Duo or Squad partner."
    />
    <meta property="og:image" content="/og-banner.png" />
    <title>KuchuPuchu</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #f7f6f4;
        transition: opacity 0.35s ease;
      }
      #splash .splash-inner {
        display: grid;
        justify-items: center;
        gap: 18px;
      }
      #splash .splash-app {
        width: 88px;
        height: 88px;
        border-radius: 22px;
      }
      #splash .splash-word {
        width: min(240px, 68vw);
        height: auto;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-inner">
        <img class="splash-app" src="/brand/icon-app-gold.png" alt="" />
        <img class="splash-word" src="/brand/logo-horizontal.png" alt="KuchuPuchu" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
