services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      PUBLIC_APP_URL: https://kuchupuchu.rabbihossainltd.online
      DATABASE_URL: file:/app/data/prod.db
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: "true"
      SPV_MODE: sandbox
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    volumes:
      - kuchupuchu-data:/app/data
      - kuchupuchu-uploads:/app/uploads

volumes:
  kuchupuchu-data:
  kuchupuchu-uploads:
