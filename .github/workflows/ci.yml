name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker (typecheck, tests, format, secrets)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Formatting
        run: npm run format:check
      - name: Secret scan
        run: npm run security:secrets
      # §50's rungs that Gradle does not cover: manifest contract (exported,
      # foregroundServiceType, permission justification), resource existence and
      # naming, dependency pinning, and the lint gate itself.
      - name: Android validation
        run: npm run validate:android
      # Pinned + checksum-pinned (see scripts/ktlint-check.sh): a style gate that
      # downloads `latest` is how a green main branch starts failing by itself.
      - name: Kotlin import hygiene
        run: ./scripts/ktlint-check.sh

  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    # §51 signing: the release key lives here and nowhere else in the tree. Gradle reads
    # exactly these four names; a run without them (fork, no access) falls back to debug
    # signing and the certificate step prints a warning instead of failing.
    env:
      KP_KEYSTORE_B64: ${{ secrets.KP_KEYSTORE_B64 }}
      KP_STORE_PASSWORD: ${{ secrets.KP_STORE_PASSWORD }}
      KP_KEY_ALIAS: ${{ secrets.KP_KEY_ALIAS }}
      KP_KEY_PASSWORD: ${{ secrets.KP_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      # §50 puts unit tests and lint before the build, and until now neither rung
      # actually ran: `lint { abortOnError = true }` was configured but no CI step
      # invoked a lint task, and the module had no test sources at all.
      - name: Unit tests + Android lint
        working-directory: native-android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug --no-daemon --continue \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      # The console report is truncated by `maxIssues`, so a red lint run has to
      # ship the whole text report; otherwise CI says "Lint found 141 errors" and the
      # only way to see them is to reproduce the build locally.
      - name: Lint and unit-test reports
        if: failure()
        run: |
          find native-android/app/build/reports -name 'lint-results*.txt' -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; || true
          find native-android/app/build/test-results -name '*.xml' -exec sh -c 'echo "--- $1"; head -40 "$1"' _ {} \; || true
      # Owner round 15: CI used to build BOTH debug and release APKs; the
      # owner wants exactly ONE artifact. The release build is the signed,
      # minified one — R8 + resource shrinking is where missing keep rules
      # and reflective lookups surface. (Debug compilation itself is still
      # covered above by testDebugUnitTest + lintDebug.)
      - name: Build release APK (minify + shrink)
        working-directory: native-android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      # §51 says the release key is the developer's own; a build that silently ships
      # debug-signed "release" artifacts is how an update-hijack survives an audit. So
      # the certificate is read out of the finished APK and compared, and if the signing
      # secret is configured but the APK is not signed by it, CI stops.
      - name: Verify the release APK's signing certificate
        env:
          KP_RELEASE_SHA256: 87faab2d49c660f87ddb1543551c3ce2b2534763404a2671399e9a1847a9c787
          KP_DEBUG_SHA256: 39190b0f38787493081c999b036e7c65fc7a4ab65d807e4dcdc25285541ecd2e
        run: |
          APK=native-android/app/build/outputs/apk/release/app-release.apk
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          [ -n "$SIGNER" ] || { echo "::warning::apksigner not found, skipping signature check"; exit 0; }
          DIGEST=$("$SIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | tr -d ':')
          echo "release APK certificate digest: $DIGEST"
          if [ -z "${KP_KEYSTORE_B64:-}" ]; then
            echo "::warning::KP_KEYSTORE_B64 is not configured — this release APK is debug-signed and must not be distributed."
            exit 0
          fi
          if [ "$DIGEST" = "$KP_DEBUG_SHA256" ]; then
            echo "::error::release APK is signed with the debug key although KP_KEYSTORE_B64 is set."
            exit 1
          fi
          if [ "$DIGEST" != "$KP_RELEASE_SHA256" ]; then
            echo "::error::release APK certificate ($DIGEST) is not the expected release key."
            exit 1
          fi
          echo "OK: signed with the release key."
      - name: Upload release APK (signed)
        uses: actions/upload-artifact@v4
        with:
          name: kuchupuchu-apk-release
          path: native-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

