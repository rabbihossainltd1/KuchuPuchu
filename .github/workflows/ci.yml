name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker + Web (typecheck, tests, browser QA, format, secrets)
    runs-on: ubuntu-22.04
    # Four browser suites, each with its own flagged build: the status suite
    # pushed this past the old 15-minute ceiling.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Web typecheck
        run: npm run typecheck:web
      - name: Sticker catalog matches the Android source
        run: npm run check:web-stickers
      - name: Web production build
        run: npm run build:web
      - name: Web service worker artifact
        run: npm run verify:web-sw
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Install Chromium for Web browser QA
        run: npx playwright install --with-deps chromium
      - name: Web browser and accessibility tests
        run: npm run test:web:e2e
      # The account and messaging suites build with their rollout flags on, so
      # they are separate runs rather than a flag inside the shell suite. Both
      # were previously only reachable through `npm run ci`.
      - name: Web account browser tests
        run: npm run test:web:account:e2e
      - name: Web messaging browser tests
        run: npm run test:web:messaging:e2e
      - name: Web status browser tests
        run: npm run test:web:status:e2e
      - name: Upload Web browser QA report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Formatting
        run: npm run format:check
      - name: Secret scan
        run: npm run security:secrets
      # §50's rungs that Gradle does not cover: manifest contract (exported,
      # foregroundServiceType, permission justification), resource existence and
      # naming, dependency pinning, and the lint gate itself.
      - name: Android validation
        run: npm run validate:android
      # Pinned + checksum-pinned (see scripts/ktlint-check.sh): a style gate that
      # downloads `latest` is how a green main branch starts failing by itself.
      - name: Kotlin import hygiene
        # Called through bash: the repo's exec bit has twice been lost to a
        # workspace snapshot restore, and `bash x.sh` never depends on it.
        run: bash ./scripts/ktlint-check.sh

  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # No setup-android: v3 requests the long-obsolete `tools` package.
      # ubuntu-22.04 ships the Android SDK command-line tools; install the exact
      # API 37 platform required by Compose 1.12.1 before Gradle runs.
      - name: Install Android API 37 platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          if [ ! -x "$SDKMANAGER" ]; then echo "sdkmanager not found under $SDK_ROOT"; exit 1; fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0"
      # §50 puts unit tests and lint before the build, and until now neither rung
      # actually ran: `lint { abortOnError = true }` was configured but no CI step
      # invoked a lint task, and the module had no test sources at all.
      - name: Unit tests + Android lint
        working-directory: native-android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug --no-daemon --continue \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      # The console report is truncated by `maxIssues`, so a red lint run has to
      # ship the whole text report; otherwise CI says "Lint found 141 errors" and the
      # only way to see them is to reproduce the build locally.
      - name: Lint and unit-test reports
        if: failure()
        run: |
          find native-android/app/build/reports -name 'lint-results*.txt' -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; || true
          find native-android/app/build/test-results -name '*.xml' -exec sh -c 'echo "--- $1"; head -40 "$1"' _ {} \; || true
      # Owner 2026-09-22: from now only RELEASE apk — debug removed to save storage.
      # Previous 79 releases + 628 artifacts deleted (storage limit).
      - name: Build APK (release only)
        working-directory: native-android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kuchupuchu-apk
          path: |
            native-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      # Keep the private, build-matched R8 map so obfuscated Compose crashes can
      # be retraced to the exact source callsite. The APK artifact remains separate.
      - name: Upload release R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: kuchupuchu-r8-mapping
          path: native-android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

